name: toon-post

# 골든튠(인스타툰) 게시: 피드(만화 캐러셀) + 릴스를 함께 올린다.
# 이미지·영상은 미리 out/<slug>/ 에 올려 두고, 실행할 때 원고 번호를 넣는다.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "골든튠 원고 번호 (toon/NN.json 의 NN, 예: 00)"
        required: true
        default: "00"

permissions:
  contents: write

concurrency: instagram-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 원고 확인
        id: pick
        run: |
          git pull -q origin main
          P="toon/${{ inputs.episode }}.json"
          test -f "$P" || { echo "::error::$P 없음"; exit 1; }
          SLUG=$(python3 -c "import json;print(json.load(open('$P',encoding='utf-8'))['slug'])")
          if python3 -c "import json,sys;s=json.load(open('state.json'));sys.exit(0 if '$SLUG' in s.get('toon_published',[]) else 1)"; then
            echo "::warning::$SLUG 은 이미 게시됨 — 건너뜀"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$P" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 공개 주소 준비 (이미지·영상 미리 열어 두기)
        if: steps.pick.outputs.skip != '1'
        run: |
          BASE="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${SHA}/out/${{ steps.pick.outputs.slug }}"
          for f in $(ls out/${{ steps.pick.outputs.slug }}); do
            ok=0
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/$f")
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 5
            done
            echo "$f -> $code"
            [ "$ok" = "1" ] || { echo "::error::$f 공개 주소 준비 실패"; exit 1; }
          done
          sleep 20

      - name: 피드(캐러셀) 게시
        if: steps.pick.outputs.skip != '1'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          export IMAGE_BASE="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${SHA}"
          python3 publish.py post ${{ steps.pick.outputs.path }} toon_published ${{ steps.pick.outputs.slug }}
          git config user.name "goldenducklab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "published toon ${{ steps.pick.outputs.slug }}"
          git pull --rebase
          git push

      - name: 릴스 게시
        if: steps.pick.outputs.skip != '1'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          export IMAGE_BASE="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${SHA}"
          python3 publish.py reel ${{ steps.pick.outputs.path }} ${{ steps.pick.outputs.slug }}
          git add state.json
          git commit -m "published toon reel ${{ steps.pick.outputs.slug }}"
          git pull --rebase
          git push
