name: toon-post

# 골든튠(인스타툰) 게시: 피드(만화 캐러셀) + 릴스를 함께 올린다.
# 이미지·영상은 미리 out/<slug>/ 에 올려 두고, 실행할 때 원고 번호를 넣는다.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "골든튠 원고 번호 (toon/NN.json 의 NN, 예: 00)"
        required: true
        default: "00"

permissions:
  contents: write

concurrency: instagram-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 원고 확인
        id: pick
        run: |
          git pull -q origin main
          P="toon/${{ inputs.episode }}.json"
          test -f "$P" || { echo "::error::$P 없음"; exit 1; }
          SLUG=$(python3 -c "import json;print(json.load(open('$P',encoding='utf-8'))['slug'])")
          if python3 -c "import json,sys;s=json.load(open('state.json'));sys.exit(0 if '$SLUG' in s.get('toon_published',[]) else 1)"; then
            echo "::warning::$SLUG 은 이미 게시됨 — 건너뜀"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$P" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 공개 주소 준비 (jsDelivr가 막히면 GitHub 원본 주소 사용)
        if: steps.pick.outputs.skip != '1'
        run: |
          SLUG=${{ steps.pick.outputs.slug }}
          check() {  # $1 = 주소 접두사, 모든 파일이 200이면 0
            for f in $(ls out/$SLUG); do
              ok=0
              for i in $(seq 1 6); do
                code=$(curl -s -o /dev/null -w "%{http_code}" "$1/out/$SLUG/$f")
                [ "$code" = "200" ] && { ok=1; break; }
                sleep 5
              done
              echo "$f -> $code"
              [ "$ok" = "1" ] || return 1
            done
          }
          J="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${SHA}"
          R="https://raw.githubusercontent.com/${{ github.repository }}/${SHA}"
          if check "$J"; then echo "IMAGE_BASE=$J" >> "$GITHUB_ENV"
          elif check "$R"; then echo "::warning::jsDelivr 대신 GitHub 원본 주소 사용"; echo "IMAGE_BASE=$R" >> "$GITHUB_ENV"
          else echo "::error::이미지 공개 주소 준비 실패"; exit 1; fi
          sleep 20

      - name: 피드(캐러셀) 게시
        if: steps.pick.outputs.skip != '1'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python3 publish.py post ${{ steps.pick.outputs.path }} toon_published ${{ steps.pick.outputs.slug }}
          git config user.name "goldenducklab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "published toon ${{ steps.pick.outputs.slug }}"
          git pull --rebase
          git push

      - name: 릴스 게시
        if: steps.pick.outputs.skip != '1'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python3 publish.py reel ${{ steps.pick.outputs.path }} ${{ steps.pick.outputs.slug }}
          git add state.json
          git commit -m "published toon reel ${{ steps.pick.outputs.slug }}"
          git pull --rebase
          git push
