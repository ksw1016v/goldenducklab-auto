name: token-check
on:
  workflow_dispatch:
    inputs:
      revoke: { default: '0' }
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 새 토큰과 옛 토큰 비교 (값은 출력하지 않음)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          OLD=$(git show fb933a9:insights.json | grep -o 'access_token=EAA[^&"]*' | head -1 | cut -d= -f2)
          echo "::add-mask::$OLD"
          NEW_FP=$(printf 'access_token=%s\n' "$IG_TOKEN" | sha256sum | cut -c1-8)
          echo "지금 시크릿 지문: $NEW_FP (노출된 토큰 지문 bf1d37e6)"
          if [ "${{ inputs.revoke }}" = "1" ]; then OLD="$OLD" python3 .github/scripts/token_revoke.py; sleep 10; fi
          OLD="$OLD" python3 .github/scripts/token_info.py
          curl -s "https://graph.facebook.com/v23.0/17841465585453824?fields=username,followers_count&access_token=$IG_TOKEN" | python3 -c "import json,sys;d=json.load(sys.stdin);print('새 토큰으로 인스타 계정 읽기:',d.get('username'),d.get('followers_count'),d.get('error',{}).get('message',''))"
