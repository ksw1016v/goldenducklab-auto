name: grid-post

# 20년 바둑판(S&P500 월별 등락) · 매달 첫째 월요일 12:10 KST (Claude 예약 작업이 매주 월요일 실행 신호, 첫째 주가 아니면 건너뜀)
# force=1 이면 날짜 조건 없이 이번 달(또는 month) 편을 바로 게시
on:
  workflow_dispatch:
    inputs:
      force: { default: "0" }
      month: { default: "" }

permissions:
  contents: write

concurrency: instagram-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 올릴 날인지 확인
        id: guard
        run: |
          git pull -q origin main
          if [ "${{ inputs.force }}" = "1" ]; then echo "skip=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          F=$(python3 grid/make_grid.py check)
          if [ "$F" != "first=1" ]; then echo "::notice::첫째 월요일이 아니라 건너뜀"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 guard.py grid >> "$GITHUB_OUTPUT"

      - name: 데이터 갱신과 원고
        if: steps.guard.outputs.skip != '1'
        id: pick
        run: |
          pip install -q yfinance pandas
          python3 grid/fetch_grid.py || echo "::warning::바둑판 데이터 갱신 실패, 이전 데이터 사용"
          python3 grid/make_grid.py ${{ inputs.month }} >> "$GITHUB_OUTPUT"
          P=$(grep '^path=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          python3 caption_check.py $P

      - name: 한글 폰트와 브라우저
        if: steps.pick.outputs.path != ''
        run: |
          mkdir -p ~/.local/share/fonts && cp fonts/*.otf ~/.local/share/fonts/ && fc-cache -f
          pip install -q playwright==1.48.0 numpy imageio-ffmpeg
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"; else python -m playwright install chromium; fi

      - name: 릴스 만들고 저장소에 올리기
        if: steps.pick.outputs.path != ''
        run: |
          python3 reel.py ${{ steps.pick.outputs.path }}
          git config user.name "goldenducklab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add grid/data.json grid/ready out/${{ steps.pick.outputs.slug }}
          git commit -m "render ${{ steps.pick.outputs.slug }}" || true
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 릴스 게시
        if: steps.pick.outputs.path != ''
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          export IMAGE_BASE="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${SHA}"
          sleep 45
          python3 publish.py reel ${{ steps.pick.outputs.path }} ${{ steps.pick.outputs.val }}
          git add state.json
          git commit -m "published grid ${{ steps.pick.outputs.val }}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
