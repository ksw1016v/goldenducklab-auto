name: income-data

# 현금흐름편 배당 데이터 갱신 (수동 실행 + 매달 1일)
on:
  workflow_dispatch:
  schedule:
    - cron: "10 2 1 * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas
      - run: python etf/income.py
      - name: 결과 저장
        run: |
          git config user.name "goldenducklab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add etf/income.json
          git commit -m "update income data" || exit 0
          git pull --rebase
          git push
