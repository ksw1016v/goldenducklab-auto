name: grid-data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q yfinance pandas
          python3 grid/fetch_grid.py
          git config user.name "goldenducklab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add grid/data.json && git commit -qm "grid data" || true
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
