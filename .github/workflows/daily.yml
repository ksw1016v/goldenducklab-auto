name: daily-post

on:
  schedule:
    # 목표 09:00 KST · 예비 실행(정시 실행은 Claude 예약 작업이 08:56에 시작)
    - cron: "47 23 * * *"
    - cron: "53 23 * * *"
    - cron: "7 0 * * *"
    - cron: "23 0 * * *"
    - cron: "47 0 * * *"
    - cron: "17 1 * * *"
    - cron: "47 1 * * *"
  workflow_dispatch:       # 수동 실행 버튼

permissions:
  contents: write

concurrency: instagram-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # 러너 기본 파이썬(3.14)에서 playwright 설치가 깨져서 3.12로 고정
        with:
          python-version: "3.12"

      - name: 오늘 이미 올렸는지 확인
        id: guard
        run: |
          git pull -q origin main
          python3 guard.py basic >> "$GITHUB_OUTPUT"

      - name: 다음 편 확인
        if: steps.guard.outputs.skip != '1'
        id: pick
        run: echo "no=$(python3 publish.py next)" >> "$GITHUB_OUTPUT"

      - name: 대기열 비어 있음
        if: steps.guard.outputs.skip != '1' && steps.pick.outputs.no == ''
        run: echo "::warning::게시할 편이 없어요. episodes 폴더에 새 편을 추가해 주세요."

      - name: 한글 폰트와 브라우저 설치
        if: steps.pick.outputs.no != ''
        run: |
          mkdir -p ~/.local/share/fonts && cp fonts/*.otf ~/.local/share/fonts/ && fc-cache -f
          pip install -q playwright==1.48.0
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"; else python -m playwright install chromium; fi

      - name: 카드뉴스 렌더링 후 저장소에 올리기
        if: steps.pick.outputs.no != ''
        run: |
          NO=$(printf "%02d" ${{ steps.pick.outputs.no }})
          python3 render.py episodes/$NO.json
          git config user.name "goldenducklab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/$NO
          git commit -m "render episode $NO" || true
          git pull --rebase
          git push
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 인스타그램 게시
        if: steps.pick.outputs.no != ''
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          export IMAGE_BASE="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${SHA}"
          sleep 20
          python3 publish.py post ${{ steps.pick.outputs.no }}
          git add state.json
          git commit -m "published episode ${{ steps.pick.outputs.no }}"
          git pull --rebase
          git push
