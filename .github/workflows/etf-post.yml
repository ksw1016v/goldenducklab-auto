name: etf-post

on:
  schedule:
    - cron: "0 10 * * *"   # 매일 19:00 KST (10:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency: instagram-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 다음 ETF 원고 만들기
        id: pick
        run: |
          OUT=$(python3 etf/make_episode.py next)
          echo "path=$(echo $OUT | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "ticker=$(echo $OUT | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "다음 ETF: $OUT"

      - name: 대기열 비어 있음
        if: steps.pick.outputs.path == ''
        run: echo "::warning::ETF 대기열이 비었어요. etf/queue.txt에 티커를 추가해 주세요."

      - name: 한글 폰트와 브라우저 설치
        if: steps.pick.outputs.path != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: 카드뉴스 렌더링 후 저장소에 올리기
        if: steps.pick.outputs.path != ''
        run: |
          python3 render.py ${{ steps.pick.outputs.path }}
          git config user.name "goldenducklab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add etf/episodes out/
          git commit -m "render ETF ${{ steps.pick.outputs.ticker }}" || true
          git pull --rebase
          git push
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 인스타그램 게시
        if: steps.pick.outputs.path != ''
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          export IMAGE_BASE="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${SHA}"
          sleep 20
          python3 publish.py post ${{ steps.pick.outputs.path }} etf_published ${{ steps.pick.outputs.ticker }}
          git add state.json
          git commit -m "published ETF ${{ steps.pick.outputs.ticker }}"
          git pull --rebase
          git push
