name: quiz-data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas
      - run: python quiz/fetch_quiz.py
      - name: 결과 저장
        run: |
          git config user.name "goldenducklab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add quiz/quiz_data.json
          git commit -m "quiz data" || exit 0
          git pull --rebase
          git push
